name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: build-macos-${{ github.ref }}-xcode${{ matrix.xcode }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '27'
            runner: xcode-27
            xcode_app: /Applications/Xcode_27.app
          - xcode: '26'
            runner: macos-26
            xcode_app: /Applications/Xcode_26.6.app

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git submodule sync --recursive
          git config submodule.third-party/twidget.update none
          git config submodule.third-party/widget-sandbox.update none
          git submodule update --init --recursive --depth 1 --jobs 8 \
            || git submodule update --init --recursive --jobs 8

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          XCODE="${{ matrix.xcode_app }}"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          sudo ln -sfn "$XCODE" /Applications/Xcode.app
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare build environment
        run: |
          if ! brew install openssl@1.1; then
            sed -i '' '/openssl@1.1/d' scripts/setup_build_env.sh
            brew install openssl@3
          fi
          bash scripts/setup_build_env.sh

      - name: Apply Xcode 27 project changes
        if: matrix.xcode == '27'
        run: |
          bash scripts/xcode27.sh apply
          if ! xcodebuild -showComponent MetalToolchain | grep -qi "installed"; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Native framework cache key
        id: frameworks-key
        run: |
          SUBMODULES="$(git submodule status --recursive | shasum -a 256 | cut -d' ' -f1)"
          XCODE_HASH="$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)"
          echo "prefix=frameworks-$XCODE_HASH-$SUBMODULES-" >> "$GITHUB_OUTPUT"
          echo "xcode=$XCODE_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore native frameworks
        uses: actions/cache/restore@v4
        with:
          path: |
            core-xprojects/*/build
            packages/WalletEngine/wallet_engineFFI.xcframework
          key: ${{ steps.frameworks-key.outputs.prefix }}${{ hashFiles('scripts/configure_frameworks.sh', 'scripts/framework-inputs.sh', 'core-xprojects/**/*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.frameworks-key.outputs.prefix }}
            frameworks-${{ steps.frameworks-key.outputs.xcode }}-

      - name: Build native frameworks
        id: frameworks
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: sh scripts/configure_frameworks.sh

      - name: Save native frameworks
        if: always() && steps.frameworks.conclusion != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            core-xprojects/*/build
            packages/WalletEngine/wallet_engineFFI.xcframework
          key: ${{ steps.frameworks-key.outputs.prefix }}${{ hashFiles('scripts/configure_frameworks.sh', 'scripts/framework-inputs.sh', 'core-xprojects/**/*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Diagnose wallet engine
        if: failure() && steps.frameworks.conclusion == 'failure'
        shell: bash {0}
        run: |
          ENGINE=submodules/telegram-ios/third-party/wallet-engine/wallet-engine
          cd "$ENGINE"
          cat rust-toolchain.toml 2>/dev/null || true
          rustc --version; cargo --version; xcrun --find ld; ld -v 2>&1 | head -3
          for f in target/bindings-host/release/deps/libzeroize_derive-*; do
            echo "== $f"; ls -la "$f"
            otool -l "$f" | grep -B1 -A4 "sectname .rustc" || echo "no .rustc section"
          done
          env -u SDKROOT CARGO_TARGET_DIR="$PWD/target/bindings-host-diag" cargo build --release --locked -v 2>&1 | grep -E "zeroize|error|warning: |Finished" | tail -40 || true

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Telegram-Mac.xcworkspace \
            -scheme Telegram \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E '(error|warning: unable|BUILD (SUCCEEDED|FAILED))' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: Package app
        run: |
          APP="$(find build/DerivedData/Build/Products/Debug -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging $APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Telegram-Debug-Xcode${{ matrix.xcode }}.zip

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: Telegram-Debug-Xcode${{ matrix.xcode }}-${{ github.sha }}
          path: Telegram-Debug-Xcode${{ matrix.xcode }}.zip
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log-Xcode${{ matrix.xcode }}-${{ github.sha }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
